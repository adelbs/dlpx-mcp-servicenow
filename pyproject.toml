[project]
name = "dlpx-servicenow-orchestrator"
version = "0.1.0"
description = "Incident-driven Delphix VDB orchestrator, triggered by ServiceNow Incident state changes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "anthropic>=0.40",
    "mcp>=1.9.0",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    # The official Delphix DCT MCP server (console script `dct-mcp-server`),
    # spawned directly as a stdio subprocess by app/mcp_client.py — see
    # docs/architecture.md. Not on PyPI, installed straight from source; `uv
    # sync`/`uv lock` pin the resolved commit in uv.lock, so installs stay
    # reproducible until this ref is deliberately bumped.
    "dct-mcp-server @ git+https://github.com/delphix/dxi-mcp-server.git",
    "ollama>=0.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
# Required for the dct-mcp-server git dependency above (a PEP 508 direct
# reference — no PyPI package exists for it).
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--tb=short"
